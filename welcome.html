<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome Page</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }

        .welcome-box {
            background: #ffffff;
            width: 380px;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .welcome-box h1 {
            margin-bottom: 10px;
            color: #333;
        }

        .welcome-box p {
            color: gray;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .welcome-box a {
            display: block;
            text-decoration: none;
            margin-top: 10px;
        }

        .welcome-box button {
            width: 100%;
            padding: 12px;
            background-color: #11998e;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .welcome-box button:hover {
            background-color: #0f857a;
        }
    </style>

</head>
<body>

    <div class="welcome-box">
        <h1>Welcome!</h1>
        <p>You have successfully logged in.</p>

        <!-- About Us Button -->
        <a href="aboutus.html">
            <button>About Us</button>
        </a>
    </div>

</body>
</html>
